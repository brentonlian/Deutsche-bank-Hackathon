<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Atkinson Hyperlegible Next, Atkinson Hyperlegible, Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0F1B2D"/>
    </marker>
    <marker id="arrowGrey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6B7686"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="#F2F3F0"/>

  <!-- Title -->
  <text x="60" y="70" font-size="40" font-weight="800" fill="#0F1B2D">Rooted: MVP architecture</text>
  <text x="60" y="108" font-size="20" fill="#3B4656">Next.js 16 + TypeScript · one codebase · runs fully offline with saved content</text>

  <!-- Browser -->
  <rect x="60" y="150" width="520" height="560" rx="8" fill="#FFFFFF" stroke="#0F1B2D" stroke-width="3"/>
  <rect x="60" y="150" width="520" height="56" rx="8" fill="#0F1B2D"/>
  <rect x="60" y="190" width="520" height="16" fill="#0F1B2D"/>
  <text x="84" y="187" font-size="22" font-weight="800" fill="#FFFFFF">User's browser (React client)</text>

  <g font-size="18" fill="#0F1B2D">
    <rect x="84" y="226" width="472" height="70" rx="6" fill="#E6E8E3"/>
    <text x="104" y="256" font-weight="800">Onboarding</text>
    <text x="104" y="282" fill="#3B4656">country, city, language, age, budget → persona</text>

    <rect x="84" y="308" width="472" height="96" rx="6" fill="#E6E8E3"/>
    <text x="104" y="338" font-weight="800">Learning line</text>
    <text x="104" y="364" fill="#3B4656">country guide · lessons + quizzes · 3 calculators</text>
    <text x="104" y="388" fill="#3B4656">(budget, savings growth, debt payoff)</text>

    <rect x="84" y="416" width="472" height="96" rx="6" fill="#E6E8E3"/>
    <text x="104" y="446" font-weight="800">Life Path game engine (pure TypeScript)</text>
    <text x="104" y="472" fill="#3B4656">seeded events · money ledger · what-if ·</text>
    <text x="104" y="496" fill="#3B4656">exhaustive optimal-path search</text>

    <rect x="84" y="524" width="226" height="86" rx="6" fill="#E6E8E3"/>
    <text x="104" y="554" font-weight="800">i18n t()</text>
    <text x="104" y="580" fill="#3B4656">+ Intl number</text>
    <text x="104" y="600" fill="#3B4656">and currency</text>

    <rect x="330" y="524" width="226" height="86" rx="6" fill="#DCE5F5"/>
    <text x="350" y="554" font-weight="800">localStorage</text>
    <text x="350" y="580" fill="#3B4656">profile, progress,</text>
    <text x="350" y="600" fill="#3B4656">game. Never leaves</text>

    <text x="84" y="650" font-size="16" fill="#3B4656">Read-aloud: browser speech engine (on device)</text>
    <text x="84" y="676" font-size="16" fill="#3B4656">Themes: light · dark · high contrast · calm</text>
  </g>

  <!-- Server -->
  <rect x="680" y="150" width="400" height="330" rx="8" fill="#FFFFFF" stroke="#0F1B2D" stroke-width="3"/>
  <rect x="680" y="150" width="400" height="56" rx="8" fill="#1F5FBF"/>
  <rect x="680" y="190" width="400" height="16" fill="#1F5FBF"/>
  <text x="704" y="187" font-size="22" font-weight="800" fill="#FFFFFF">Next.js server</text>
  <g font-size="18" fill="#0F1B2D">
    <text x="704" y="240" font-weight="800">Pre-rendered pages</text>
    <text x="704" y="264" fill="#3B4656">static shell, served from CDN</text>
    <rect x="704" y="286" width="352" height="172" rx="6" fill="#E6E8E3"/>
    <text x="724" y="316" font-weight="800">POST /api/lesson</text>
    <text x="724" y="342" fill="#3B4656">1. validate request (Zod)</text>
    <text x="724" y="366" fill="#3B4656">2. saved lesson? → return it</text>
    <text x="724" y="390" fill="#3B4656">3. else generate, grounded in</text>
    <text x="724" y="412" fill="#3B4656">    country facts, validate, save</text>
    <text x="724" y="436" fill="#3B4656">4. on failure → nearest saved</text>
  </g>

  <!-- LLM adapter -->
  <rect x="1180" y="150" width="360" height="330" rx="8" fill="#FFFFFF" stroke="#0F1B2D" stroke-width="3"/>
  <rect x="1180" y="150" width="360" height="56" rx="8" fill="#127A4B"/>
  <rect x="1180" y="190" width="360" height="16" fill="#127A4B"/>
  <text x="1204" y="187" font-size="22" font-weight="800" fill="#FFFFFF">LLM provider adapter</text>
  <g font-size="18" fill="#0F1B2D">
    <text x="1204" y="242" font-weight="800">Gemini 2.5 Flash</text>
    <text x="1204" y="266" fill="#3B4656">→ Flash-Lite on quota / overload</text>
    <text x="1204" y="306" font-weight="800">Ollama (e.g. Qwen)</text>
    <text x="1204" y="330" fill="#3B4656">on-prem, no data leaves</text>
    <text x="1204" y="370" font-weight="800">OpenAI / Claude</text>
    <text x="1204" y="394" fill="#3B4656">optional adapters</text>
    <text x="1204" y="440" fill="#127A4B" font-weight="800">Production: Vertex AI (EU)</text>
  </g>

  <!-- Content layer -->
  <rect x="680" y="560" width="860" height="150" rx="8" fill="#FFFFFF" stroke="#0F1B2D" stroke-width="3" stroke-dasharray="0"/>
  <text x="704" y="598" font-size="22" font-weight="800" fill="#0F1B2D">Content layer: JSON in Git, schema-validated in CI</text>
  <g font-size="17" fill="#0F1B2D">
    <rect x="704" y="616" width="196" height="76" rx="6" fill="#FFE1D3"/>
    <text x="718" y="644" font-weight="800">Region packs</text>
    <text x="718" y="668" fill="#3B4656">US · IN · DE · MX</text>
    <text x="718" y="686" fill="#3B4656" font-size="14">facts + sources + dates</text>
    <rect x="912" y="616" width="196" height="76" rx="6" fill="#FCEFC4"/>
    <text x="926" y="644" font-weight="800">Translations</text>
    <text x="926" y="668" fill="#3B4656">en · de · es · hi</text>
    <text x="926" y="686" fill="#3B4656" font-size="14">+ region overlays</text>
    <rect x="1120" y="616" width="196" height="76" rx="6" fill="#DCE5F5"/>
    <text x="1134" y="644" font-weight="800">Saved lessons</text>
    <text x="1134" y="668" fill="#3B4656">+ quizzes</text>
    <text x="1134" y="686" fill="#3B4656" font-size="14">offline demo</text>
    <rect x="1328" y="616" width="196" height="76" rx="6" fill="#D6EBDF"/>
    <text x="1342" y="644" font-weight="800">Personas</text>
    <text x="1342" y="668" fill="#3B4656">fixed seeds for</text>
    <text x="1342" y="686" fill="#3B4656" font-size="14">a repeatable demo</text>
  </g>

  <!-- Pipelines & CI -->
  <rect x="60" y="760" width="760" height="100" rx="8" fill="#FFFFFF" stroke="#6B7686" stroke-width="2.5" stroke-dasharray="10 7"/>
  <text x="84" y="796" font-size="20" font-weight="800" fill="#0F1B2D">Build-time pipelines</text>
  <text x="84" y="824" font-size="17" fill="#3B4656">npm run localize: AI-drafted translations, placeholder + glossary checks</text>
  <text x="84" y="848" font-size="17" fill="#3B4656">npm run lessons: pre-generates lessons, paced for free-tier quotas</text>
  <rect x="860" y="760" width="680" height="100" rx="8" fill="#FFFFFF" stroke="#6B7686" stroke-width="2.5" stroke-dasharray="10 7"/>
  <text x="884" y="796" font-size="20" font-weight="800" fill="#0F1B2D">CI: GitHub Actions on every push</text>
  <text x="884" y="824" font-size="17" fill="#3B4656">lint · typecheck · 64 unit tests (engine, packs, translations,</text>
  <text x="884" y="848" font-size="17" fill="#3B4656">lessons cite only real facts, tool math) · production build</text>

  <!-- Arrows -->
  <path d="M580 400 L676 360" stroke="#0F1B2D" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <text x="590" y="352" font-size="15" fill="#0F1B2D" font-weight="800">lesson request</text>
  <path d="M1080 330 L1176 330" stroke="#0F1B2D" stroke-width="3" fill="none" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <path d="M880 480 L880 556" stroke="#0F1B2D" stroke-width="3" fill="none" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <text x="892" y="525" font-size="15" fill="#0F1B2D" font-weight="800">read / save</text>
  <path d="M580 640 L676 640" stroke="#0F1B2D" stroke-width="3" fill="none" marker-start="url(#arrow)"/>
  <text x="590" y="628" font-size="15" fill="#0F1B2D" font-weight="800">bundled</text>
  <path d="M820 790 L1000 714" stroke="#6B7686" stroke-width="2.5" fill="none" stroke-dasharray="8 6" marker-end="url(#arrowGrey)"/>
  <text x="620" y="745" font-size="15" fill="#6B7686" font-weight="800">writes content (reviewed in a PR)</text>
</svg>
